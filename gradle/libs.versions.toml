# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
scafall = "1.0-alpha.3.0"
viewportl = "alpha0.1.0.0-SNAPSHOT"

# Spigot/Paper/Folia
bstats = "3.0.0"

[libraries]
viewportl = { module = "com.wolfyscript.viewportl:viewportl-api", version.ref = "viewportl" }

scafall-core = { module = "com.wolfyscript.scafall.core:core", version.ref = "scafall" }
scafall-identifiers = { module = "com.wolfyscript.scafall.identifiers:identifiers", version.ref = "scafall" }
scafall-wrappers = { module = "com.wolfyscript.scafall.wrappers:wrappers", version.ref = "scafall" }
scafall-scheduler = { module = "com.wolfyscript.scafall.scheduler:scheduler", version.ref = "scafall" }
scafall-adventureutils = { module = "com.wolfyscript.scafall.adventure-utils:adventure-utils", version.ref = "scafall" }
scafall-wrappers-spigot = { module = "com.wolfyscript.scafall.wrappers:wrappers-spigot", version.ref = "scafall" }

bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }

[bundles]
scafall = [ "scafall-core", "scafall-identifiers", "scafall-wrappers", "scafall-scheduler", "scafall-adventureutils" ]